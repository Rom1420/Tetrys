<div class="game-resume-container">
    <div class="stats-header">
        <h1>
            Résumé de partie
        </h1>
    </div>
    <div class="resume-stat">
    <h1 class="mode-value" 
        [ngClass]="{
            'green': (gameResume?.gameMode | uppercase) === 'DÉBUTANT', 
            'orange': (gameResume?.gameMode | uppercase) === 'INTERMÉDIAIRE' || 'INTERMEDIAIRE', 
            'red': (gameResume?.gameMode | uppercase) === 'AVANCÉ', 
            'cyan': (gameResume?.gameMode | uppercase) === 'PERSO',
            'default': !['DÉBUTANT', 'INTERMÉDIAIRE', 'AVANCÉ', 'PERSO'].includes((gameResume?.gameMode || '').toUpperCase())
        }">
        {{ gameResume?.gameMode | uppercase}}
        </h1>
    </div>
    <div class="resume-stat"    >
        <h1 class="basic-stat-value">{{ gameResume?.gameScore }}</h1>
        <p class="basic-stat-title">Score</p>
    </div>
    <div class="stars-container">
        <span class="star-rating">
            <star *ngFor="let _ of [].constructor(gameResume?.gameStars)"></star>
        </span>
    </div>
</div>
