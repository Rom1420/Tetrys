<div class="difficulty-list-component">
  <div class="difficulty-container">
      <h1 class="difficulty-list-text">Choisissez une difficulté</h1>
      <difficulty-button 
        *ngFor="let difficulty of difficultyList" 
        [difficulty]="difficulty"
        (hover)="onDifficultyHover($event)"
        (mouseleave)="onDifficultyHoverEnd()">
      </difficulty-button>
  </div>
</div>
