<div class="difficulty-detail-component details-appear" *ngIf="currentDifficulty">
  <h1 [ngClass]="getDifficultyClass()">Mode {{ currentDifficulty.name }}</h1>
  <h3>{{ currentDifficulty.description }}</h3>
  <p>Temps par caractère : <span>{{ currentDifficulty.config.time }} sec</span></p>
  <p>Taille max d'un mot : <span>{{ currentDifficulty.config.length }} lettres</span></p>
  <p>Droit à l'erreur : <span>{{ currentDifficulty.config.errorAllowed ? "Oui" : "Non"}}</span></p>
</div>
