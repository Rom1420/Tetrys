<div class="student" *ngIf="student" (click)="onSelectStudent(student)" [ngClass]="{'selected': student.isSelected}">
    <img src="./assets/user.png" alt="img-utilisateur-inconnu">
    <p>{{student.name}}</p>
    <div class="close-button-container">
        <div (click)="openDPopup()" (click)="updateSelectedStudentIdToDelete(student)" class="close-button">
            <span></span>
            <span></span>
        </div>
    </div>
</div>
