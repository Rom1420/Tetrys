<div class="popup">
    <div class="popup-body">
        <h2>Ajouter un nouveau Profil</h2>
        <form class="profil-form" [formGroup]="profilForm">

            <label for="name">
                <p>nom du nouveau profil</p>
                <input class="input-custom" type="text" id="name" [formControlName]="'name'">
            </label>
        </form>
        <button (click)="closePopup()">close</button>
        <button type="submit" class="button-card" (click)="addProfil()" (click)="closePopup()">Create</button>
    </div>
</div>
