<div class="stat-container">
  <div class="top-container">
    <student-list [selectedStudentIdToDelete]="selectedStudentIdToDelete"></student-list> 
    <div class="progression-container">
      <stat-graph [selectedPlayerId]="selectedPlayerId"></stat-graph>
    </div>
  </div>
  <div class="bottom-container">
    <div class="historical-container">
      <div class="historical-list">
        <div class="header-container">
          <h1>Historique des parties</h1>
        </div>
        <div class="headers-list">
          <p>Date</p> 
          <p>Mode</p>
          <p>Score</p>
          <p>Etoiles</p>
          <p style="margin-right: 50px;">Detail</p>
        </div>
        <div class="scroll-container-historical">
          <ng-container *ngIf="selectedPlayerId !== null">
            <stat-game [playerId]="selectedPlayerId"></stat-game>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</div>
